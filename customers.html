<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Bill Generator — Customers</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Customers CSS -->
    <link rel="stylesheet" href="customers.css">

    <!-- 🆕 Z-INDEX FIX -->
    <style>
        .swal2-container { z-index: 999999 !important; }
    </style>
</head>
<body>

<div class="panel-container">

    <!-- ===== 📊 STATS CARDS ===== -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon" style="background:#3498db;">👥</div>
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">Total Customers</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background:#e74c3c;">💰</div>
            <div class="stat-value" id="statBalance">0</div>
            <div class="stat-label">Total Balance</div>
        </div>
    </div>

    <!-- ===== 🔍 SEARCH (Sticky) ===== -->
    <div class="search-filter-bar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Customer ka naam ya mobile likhein...">
        </div>
    </div>

    <!-- ===== ➕ ADD CUSTOMER (Collapsible) ===== -->
    <div class="panel-card">
        <div class="add-item-header" id="addCustomerToggle">
            <h2><i class="fas fa-user-plus"></i> Add New Customer</h2>
            <i class="fas fa-chevron-down toggle-arrow" id="toggleArrow"></i>
        </div>
                <form id="addCustomerForm" class="panel-form" style="display:none;">
            
            <!-- 🏪 BUSINESS INFO -->
            <div class="form-row">
                <div class="form-group">
                    <label>👤 Customer Name *</label>
                    <input type="text" id="custName" placeholder="e.g. Imtiaz Ali" required maxlength="50">
                </div>
                <div class="form-group">
                    <label>🏪 Shop Name (optional)</label>
                    <input type="text" id="custShopName" placeholder="e.g. Al-Madina Store" maxlength="50">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>🏷️ Customer Type (optional)</label>
                    <select id="custType" class="select-input">
                        <option value="">— Select —</option>
                        <option value="retail">🛒 Retail</option>
                        <option value="wholesale">📦 Wholesale</option>
                        <option value="special">⭐ Special</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>📱 Mobile (optional)</label>
                    <input type="tel" id="custMobile" maxlength="15" placeholder="03xx-xxxxxxx">
                </div>
            </div>

            <!-- 📍 LOCATION + ROUTE -->
            <div class="form-row">
                <div class="form-group">
                    <label>📍 Address (optional)</label>
                    <input type="text" id="custAddress" maxlength="100" placeholder="Street, Area">
                </div>
                <div class="form-group">
                    <label>🛣️ Route (optional)</label>
                    <input type="text" id="custRoute" maxlength="50" placeholder="e.g. Main Bazar, Gali 6">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>🏙️ City (optional)</label>
                    <input type="text" id="custCity" maxlength="30" placeholder="City">
                </div>
                <div class="form-group">
                    <label>📅 Payment Terms (optional)</label>
                    <select id="custTerms" class="select-input">
                        <option value="">— Select —</option>
                        <option value="cash">💵 Cash</option>
                        <option value="7">📅 7 Days</option>
                        <option value="15">📅 15 Days</option>
                        <option value="30">📅 30 Days</option>
                    </select>
                </div>
            </div>

            <!-- 💰 FINANCE -->
            <div class="form-row">
                <div class="form-group">
                    <label>💰 Previous Balance (optional — purani pending)</label>
                    <input type="number" id="custPrevBalance" min="0" step="0.01" placeholder="0">
                </div>
                <div class="form-group">
                    <label>💳 Credit Limit (optional — max udhaar)</label>
                    <input type="number" id="custCreditLimit" min="0" step="0.01" placeholder="0">
                </div>
            </div>
            <div class="form-group">
                <label>📝 Notes (optional)</label>
                <input type="text" id="custNotes" maxlength="150" placeholder="Koi khas baat...">
            </div>

            <button type="submit" class="btn btn-primary" id="saveCustomerBtn">
                <i class="fas fa-save"></i> SAVE CUSTOMER
            </button>
        </form>
    </div>

    <!-- ===== 👥 CUSTOMERS LIST ===== -->
    <div class="panel-card">
        <div class="card-header">
            <h2><i class="fas fa-users"></i> Customers (<span id="custCount">0</span>/<span id="custLimit">50</span>)</h2>
        </div>
        <div id="customersList">
            <div class="loading-inline">Loading customers...</div>
        </div>
    </div>

</div>

<!-- Firebase SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- 🧭 SIDEBAR SYSTEM -->
<script src="sidebar.js"></script>
<script src="customers.js"></script>
</body>
</html>
